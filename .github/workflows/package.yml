name: Package check

# Builds the four release binaries without releasing anything, and checks them the way a
# user would get them:
#
#   build     the binaries, each run end to end against the fake TV (packaging/smoke.py)
#             and kept as downloadable artifacts for a week, to try on real machines
#   scan      malware scan of the binaries (ClamAV), known vulnerabilities in the bundled
#             dependencies (pip-audit), security check of the workflows (zizmor)
#   homebrew  the formula from packaging/homebrew, installed and tested from a local tap
#
# The AUR package (packaging/aur) is not checked here: it waits until users ask for it
# (see MILESTONES.md).
#
# Start it by hand (Actions -> Package check -> Run workflow, or `gh workflow run package.yml`),
# on any branch. It also runs on pull requests that touch packaging or dependencies.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/package.yml"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: # the same machines the Release workflow builds on
          - { runner: ubuntu-22.04, asset: tvsend-linux-x86_64 }
          - { runner: ubuntu-22.04-arm, asset: tvsend-linux-arm64 }
          - { runner: macos-15, asset: tvsend-macos-arm64 }
          - { runner: macos-15-intel, asset: tvsend-macos-x86_64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build
        run: sh packaging/build.sh

      - name: Run it end to end against the fake TV
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/tvsend/__init__.py)"
          uv run python packaging/smoke.py "dist/${{ matrix.asset }}" "$version"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  scan:
    name: Malware and vulnerability scan
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Malware scan of the binaries (ClamAV, with today's signatures)
        run: |
          ls -l dist
          docker run --rm --entrypoint sh -v "$PWD/dist:/scan:ro" clamav/clamav:stable \
            -c 'freshclam --quiet || echo "freshclam failed: scanning with the signatures in the image"; clamscan --recursive --infected /scan'

      - name: Known vulnerabilities in the bundled dependencies (pip-audit)
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o runtime.txt
          pyinstaller="$(uv run --isolated --with 'pyinstaller>=6.11' python -c 'import PyInstaller; print(PyInstaller.__version__)')"
          echo "pyinstaller==$pyinstaller" >> runtime.txt
          cat runtime.txt
          uvx pip-audit==2.10.1 --disable-pip --no-deps --progress-spinner off -r runtime.txt

      - name: Security check of the workflows (zizmor)
        run: uvx zizmor==1.32.0 --offline --min-severity medium .github/workflows

  homebrew:
    name: Homebrew formula
    needs: build
    runs-on: macos-26
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Render the formula, pointing at the binaries built above
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/tvsend/__init__.py)"
          (cd dist && shasum -a 256 tvsend-* > SHA256SUMS)
          sh packaging/render.sh "$version" dist/SHA256SUMS packaging/homebrew/tvsend.rb.in \
            | sed "s#https://github.com/AndyHoang/tvsend/releases/download/v$version/#file://$PWD/dist/#" \
            > tvsend.rb
          cat tvsend.rb

      - name: Install from a local tap and run the formula's test
        run: |
          brew tap-new --no-git local/tvsend
          cp tvsend.rb "$(brew --repository local/tvsend)/Formula/tvsend.rb"
          brew style local/tvsend/tvsend
          brew install --formula local/tvsend/tvsend
          brew test local/tvsend/tvsend
          tvsend --version
