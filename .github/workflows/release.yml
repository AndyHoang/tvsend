name: Release

# The one signal that makes a release: start this workflow by hand
# (Actions -> Release -> Run workflow, or `gh workflow run release.yml -f bump=patch`).
# Binaries are built only here, never on ordinary pushes.
#
#   1. prepare  works out the new version, sets it in the source, dates the CHANGELOG
#               section, runs lint and tests, commits, tags v<version> and pushes both
#   2. build    builds the four binaries from that tag
#   3. release  publishes the GitHub Release with checksums and the CHANGELOG section
#               as notes (a version with a, b or rc in it becomes a pre-release)
#
# If a build fails after step 1, fix nothing in the tag: use "Re-run failed jobs" on the
# same run, or release the next patch version.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which version to release"
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - current
      version:
        description: "Or an exact version (for example 0.2.0rc1) - overrides the choice above"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Version, changelog, tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - name: Releases are made from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::start this workflow on the main branch"
          exit 1

      # keeps its credentials on purpose: this job pushes the release commit and tag, and
      # uploads no artifacts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked]
          fetch-depth: 0 # all tags, to check the new version is newer than the last release

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set the version, date the changelog, check, commit and tag
        id: prepare
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run python packaging/release.py "${EXACT:-$BUMP}"

      - name: Push the commit and the tag
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
        run: git push --atomic origin main "$TAG"

  build:
    name: Build ${{ matrix.asset }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built on the oldest hosted image (Ubuntu 22.04, glibc 2.35) so the
          # binary also starts on older systems than the newest one.
          - { runner: ubuntu-22.04, asset: tvsend-linux-x86_64 }
          - { runner: ubuntu-22.04-arm, asset: tvsend-linux-arm64 }
          - { runner: macos-15, asset: tvsend-macos-arm64 }
          - { runner: macos-15-intel, asset: tvsend-macos-x86_64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build
        run: sh packaging/build.sh

      - name: Check that the binary starts and reports the released version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test -f "dist/${{ matrix.asset }}"
          out="$("dist/${{ matrix.asset }}" --version)"
          echo "$out"
          case "$out" in *"$VERSION"*) ;; *) echo "::error::unexpected version output"; exit 1 ;; esac
          "dist/${{ matrix.asset }}" --help >/dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 5

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          cd dist
          ls -l
          sha256sum tvsend-linux-x86_64 tvsend-linux-arm64 tvsend-macos-arm64 tvsend-macos-x86_64 > SHA256SUMS
          cat SHA256SUMS
          cd ..
          sh packaging/release-notes.sh "$TAG" CHANGELOG.md > notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          pre=""
          case "${TAG#v}" in *a[0-9]*|*b[0-9]*|*rc[0-9]*) pre="--prerelease" ;; esac
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "tvsend ${TAG#v}" \
            --notes-file notes.md \
            --verify-tag $pre \
            dist/tvsend-linux-x86_64 dist/tvsend-linux-arm64 \
            dist/tvsend-macos-arm64 dist/tvsend-macos-x86_64 \
            dist/SHA256SUMS
