name: Release

# Two ways to run:
#
# - Push a tag like v1.2.3 (made by `uv run python packaging/release.py 1.2.3`): builds
#   the four binaries and publishes a GitHub Release with checksums and the CHANGELOG
#   section as notes. A version with a, b or rc in it (v1.2.3rc1) becomes a pre-release.
# - Start it by hand (Actions -> Release -> Run workflow): builds the four binaries and
#   keeps them as workflow artifacts for 5 days. Nothing is published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built on the oldest hosted image (Ubuntu 22.04, glibc 2.35) so the
          # binary also starts on older systems than the newest one.
          - { runner: ubuntu-22.04, asset: tvsend-linux-x86_64 }
          - { runner: ubuntu-22.04-arm, asset: tvsend-linux-arm64 }
          - { runner: macos-15, asset: tvsend-macos-arm64 }
          - { runner: macos-15-intel, asset: tvsend-macos-x86_64 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10

      - name: Version (a tag must match the version in the source)
        id: version
        shell: bash
        run: |
          src="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/tvsend/__init__.py)"
          if [ -z "$src" ]; then
            echo "::error::no __version__ found in src/tvsend/__init__.py"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$src" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ = \"$src\" in src/tvsend/__init__.py"
            exit 1
          fi
          echo "version=$src" >> "$GITHUB_OUTPUT"

      - name: Build
        run: sh packaging/build.sh

      - name: Check that the binary starts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -f "dist/${{ matrix.asset }}"
          out="$("dist/${{ matrix.asset }}" --version)"
          echo "$out"
          case "$out" in *"$VERSION"*) ;; *) echo "::error::unexpected version output"; exit 1 ;; esac
          "dist/${{ matrix.asset }}" --help >/dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 5

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and notes
        run: |
          cd dist
          ls -l
          sha256sum tvsend-linux-x86_64 tvsend-linux-arm64 tvsend-macos-arm64 tvsend-macos-x86_64 > SHA256SUMS
          cat SHA256SUMS
          cd ..
          sh packaging/release-notes.sh "$GITHUB_REF_NAME" CHANGELOG.md > notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "${GITHUB_REF_NAME#v}" in *a[0-9]*|*b[0-9]*|*rc[0-9]*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "tvsend ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag $pre \
            dist/tvsend-linux-x86_64 dist/tvsend-linux-arm64 \
            dist/tvsend-macos-arm64 dist/tvsend-macos-x86_64 \
            dist/SHA256SUMS
